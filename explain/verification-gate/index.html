<!doctype html>
<html lang="en" data-tier="heavy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>How the verification gate works</title>
<style>/* 100x flow player. Every colour, size and radius is a token defined once below; dark mode swaps
   tokens. Contrast of each text/background pair is WCAG 2.2 AA in both themes. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #f7f9fc;
  --line: #dfe4ec;
  --line-strong: #7b8799;
  --fg: #121a26;
  --muted: #4f5b6d;
  --accent: #2b54c8;
  --accent-soft: #eaf0fd;
  --req: var(--accent);
  --res: #0a6e5f;
  --job: #8a5100;
  --jobsoft: #fbefdc;
  --idle: #dde2ea;
  --soft: var(--accent-soft);
  --bad: #b42318;
  --badsoft: #fdecea;
  --good: #0a6e5f;
  --goodsoft: #e2f4ee;
  --warn: var(--job);
  --warnsoft: var(--jobsoft);
  --info: var(--accent);
  --hatch: #e9a19a;
  --focus: var(--accent);
  --l0: #2b54c8;
  --l1: #a35f00;
  --l2: #0a6e5f;
  --l3: #7a3fb8;
  --shadow-sm: 0 1px 2px rgb(16 24 40 / 0.05), 0 1px 3px rgb(16 24 40 / 0.06);
  --shadow-md: 0 2px 4px rgb(16 24 40 / 0.04), 0 8px 24px rgb(16 24 40 / 0.08);
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --t-xs: 13px;
  --t-sm: 15px;
  --t-md: 17px;
  --t-lg: 20px;
  --t-xl: 26px;
  --t-2xl: 34px;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --measure: 72ch;
  --dur: 120ms;
  --nav-w: 248px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1218; --surface: #151c26; --surface-2: #1b2431; --line: #2a3443; --line-strong: #6b7b91;
    --fg: #e6ebf2; --muted: #a2aebf; --accent: #8fabff; --accent-soft: #1f2a44; --res: #4fd1b4; --job: #f2b250; --jobsoft: #3a2b12;
    --idle: #273140; --bad: #ff8f85; --badsoft: #3d1917; --good: #4fd1b4; --goodsoft: #123029;
    --hatch: #7a2e2a; --l0: #8fabff; --l1: #f2b250; --l2: #4fd1b4; --l3: #c39bf0;
    --shadow-sm: none; --shadow-md: 0 8px 24px rgb(0 0 0 / 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1218; --surface: #151c26; --surface-2: #1b2431; --line: #2a3443; --line-strong: #6b7b91;
  --fg: #e6ebf2; --muted: #a2aebf; --accent: #8fabff; --accent-soft: #1f2a44; --res: #4fd1b4; --job: #f2b250; --jobsoft: #3a2b12;
  --idle: #273140; --bad: #ff8f85; --badsoft: #3d1917; --good: #4fd1b4; --goodsoft: #123029;
  --hatch: #7a2e2a; --l0: #8fabff; --l1: #f2b250; --l2: #4fd1b4; --l3: #c39bf0;
  --shadow-sm: none; --shadow-md: 0 8px 24px rgb(0 0 0 / 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: var(--t-sm)/1.6 var(--font-body); }
code { font-family: var(--font-mono); font-size: 0.86em; overflow-wrap: anywhere; }
a { color: var(--accent); text-underline-offset: 2px; }
h1, h2, h3, h4 { line-height: 1.25; margin: 0; text-wrap: balance; }
.skip { position: absolute; inset-inline-start: var(--s2); top: -60px; background: var(--fg); color: var(--bg); padding: var(--s2) var(--s3); border-radius: var(--r-sm); z-index: 10; }
.skip:focus { top: var(--s2); }
.wrap { max-width: 1400px; margin: 0 auto; padding: var(--s5) var(--s4) 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s5); min-width: 0; }
.wrap > * { min-width: 0; }
.loading, .fatal { color: var(--muted); padding: var(--s5); }
.muted { color: var(--muted); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.eyebrow { font-size: var(--t-xs); font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

/* hero: the first screen */
.hero { display: grid; gap: var(--s4); padding: clamp(20px, 3vw, 36px); background: linear-gradient(180deg, var(--accent-soft), var(--surface) 180px); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-md); }
.hero-top { display: flex; flex-wrap: wrap; gap: var(--s3) var(--s4); justify-content: space-between; align-items: center; }
.kicker { margin: 0; display: flex; flex-wrap: wrap; gap: var(--s2) var(--s3); align-items: center; color: var(--muted); font-size: var(--t-xs); }
.kicker code { font-size: 12.5px; }
.kchip { display: inline-block; white-space: nowrap; font-size: var(--t-xs); font-weight: 650; color: var(--accent); background: var(--surface); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 99px; padding: 1px 10px; }
h1 { font-size: clamp(var(--t-xl), 3.4vw, var(--t-2xl)); font-weight: 750; letter-spacing: -0.015em; max-width: 36ch; }
.before .purpose { margin: 0; font-size: var(--t-md); font-weight: 600; max-width: 72ch; }
.purpose-lead { margin: 0; font-size: clamp(var(--t-md), 2vw, var(--t-lg)); line-height: 1.5; max-width: 64ch; }
.tldr { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: var(--s3); }
.tl { --c: var(--accent); display: grid; gap: 6px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: var(--r-md); padding: 14px var(--s4); box-shadow: var(--shadow-sm); }
.tl-how { --c: var(--good); }
.tl-watch { --c: var(--warn); }
.tl-k { font-size: var(--t-xs); font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--c); }
.tl p { margin: 0; }
.tl > p:not(.chips) { font-size: var(--t-sm); }
.glance { position: relative; display: grid; gap: var(--s2); }
.tiles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: var(--s3); }
.tile { display: grid; grid-template-rows: 1fr auto; gap: 6px; min-width: 0; }
.tile-a { position: relative; display: grid; gap: 4px; align-content: start; height: 100%; min-height: 96px; padding: var(--s3) var(--s4); padding-inline-end: var(--s6); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); color: var(--fg); text-decoration: none; transition: border-color var(--dur), box-shadow var(--dur); }
a.tile-a:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
.tile-k { font-size: var(--t-xs); font-weight: 650; color: var(--muted); }
.tile-v { display: flex; flex-wrap: wrap; gap: 4px var(--s2); align-items: center; font-size: var(--t-md); font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile-d { font-size: var(--t-xs); color: var(--muted); overflow-wrap: anywhere; }
.tile-go { position: absolute; inset-inline-end: var(--s3); top: var(--s3); color: var(--muted); }
a.tile-a:hover .tile-go { color: var(--accent); }
.meter { flex: 1 0 100%; display: block; height: 6px; border-radius: 99px; background: var(--idle); overflow: hidden; }
.meter i { display: block; height: 100%; width: var(--p, 0%); background: var(--good); border-radius: inherit; }
.pop-btn { font-size: var(--t-xs); justify-self: start; min-height: 24px; }
.pop { position: absolute; z-index: 15; top: 100%; inset-inline-end: 0; width: min(640px, 100%); margin-top: var(--s2); padding: var(--s4); display: grid; gap: var(--s3); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-md); }
.pop h3 { font-size: var(--t-sm); }
.lede { margin: 0; padding-top: var(--s3); border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; max-width: 110ch; }
.lede-k { font-weight: 700; color: var(--fg); margin-inline-end: 4px; }
.tools { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }

/* pills and chips: tinted, body font; mono is for code only */
.pill, .kind { display: inline-block; white-space: nowrap; font: 600 11.5px/1.7 var(--font-body); text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 0 var(--s2); }

/* buttons and segmented groups */
.btn, .seg button, .controls select { font: 500 var(--t-xs) var(--font-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 7px 12px; min-height: 34px; cursor: pointer; transition: background-color var(--dur), border-color var(--dur); }
.btn:hover, .seg button:hover { background: var(--surface-2); border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); min-width: 86px; }
.btn.primary:hover { background: var(--accent); filter: brightness(1.08); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-strong); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
.seg button { border: 0; border-radius: 0; }
.seg button + button { border-inline-start: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; text-align: start; }

/* evidence legend: in Evidence, and in the Confidence tile's popover */
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: var(--s3); }
.how { background: var(--surface-2); border: 1px solid var(--line); border-inline-start: 4px solid var(--c, var(--line)); border-radius: var(--r-sm); padding: var(--s2) var(--s3); display: grid; gap: 2px; align-content: start; }
.how b { font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--c); }
.how p { margin: 0; font-size: var(--t-xs); color: var(--muted); }
.how .count { font-size: 12.5px; font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
.how.t-inferred { border-inline-start-style: dashed; }
.t-verified { --c: var(--res); }
.t-verified-absent { --c: var(--good); }
.t-measured { --c: var(--accent); }
.t-estimated { --c: var(--job); }
.t-inferred { --c: var(--muted); }
.t-step { --c: var(--muted); }

/* tag chips and evidence chips */
.chips { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tagchip { font: 600 11.5px/1.7 var(--font-body); text-transform: uppercase; letter-spacing: 0.04em; color: var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); border-radius: 99px; padding: 0 var(--s2); white-space: nowrap; }
.tagchip.t-inferred { border-style: dashed; }
.ev { display: inline-flex; gap: 6px; align-items: center; max-width: 100%; font-size: 12px; text-decoration: none; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 1px var(--s2); transition: border-color var(--dur); }
a.ev:hover { border-color: var(--accent); }
.ev .chip-k { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--c); }
.ev code { font-size: 12px; }
.numtag { font-variant-numeric: tabular-nums; font-weight: 600; text-decoration: underline dotted var(--c); text-decoration-thickness: 2px; text-underline-offset: 3px; cursor: help; }

/* banners */
.banner { margin: 0; padding: 6px var(--s3); border-radius: var(--r-sm); font-size: 14px; border: 1px solid var(--line); background: var(--surface-2); }
.banner b { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font: 700 12px var(--font-body); background: var(--muted); color: var(--surface); margin-inline-end: 4px; }
.banner.hazard { background: var(--badsoft); border-color: var(--bad); color: var(--fg); }
.banner.hazard b, .banner.failure b { background: var(--bad); }
.banner.failure { background: var(--badsoft); border-color: var(--bad); }
.banner.skipped { background: var(--goodsoft); border-color: var(--good); }
.banner.skipped b { background: var(--good); }
.banner.note { color: var(--muted); }

/* tabs, controls, fix toggle */
.bar { display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center; justify-content: space-between; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs [role="tab"] { display: inline-flex; gap: var(--s2); align-items: center; max-width: 36ch; text-align: start; font: 500 13.5px/1.3 var(--font-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 7px 12px; min-height: 36px; cursor: pointer; transition: background-color var(--dur), border-color var(--dur); }
.tabs [role="tab"]:hover { border-color: var(--accent); }
.tabs [role="tab"][aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.tabs [role="tab"][aria-selected="true"] .kind { color: var(--surface); border-color: currentColor; background: transparent; }
.controls { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.speed { display: inline-flex; gap: 6px; align-items: center; font-size: var(--t-xs); color: var(--muted); }
.fixbar { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.fixbar .seg button[aria-pressed="true"] { background: var(--good); color: var(--surface); }
.fixbar .seg button:first-child[aria-pressed="true"] { background: var(--bad); }

/* stage */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--s4); align-items: start; }
.main.wide-map { grid-template-columns: minmax(0, 1fr); }
.main.wide-map .side { grid-template-columns: minmax(0, 1fr); }
.main.wide-map .steps { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); column-gap: var(--s3); }
.side { display: grid; gap: var(--s4); min-width: 0; }
.stage, .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); min-width: 0; }
.stage { display: grid; }
.caption { padding: var(--s4) 20px var(--s3); display: grid; gap: 6px; min-height: 132px; align-content: start; }
.cap-head { display: flex; gap: var(--s3); align-items: baseline; flex-wrap: wrap; }
.num { font-size: 12px; font-weight: 650; color: var(--muted); font-variant-numeric: tabular-nums; }
.caption h2 { font-size: var(--t-lg); font-weight: 700; }
.time { font-size: 12px; font-weight: 650; color: var(--res); background: color-mix(in srgb, var(--res) 10%, transparent); border: 1px solid color-mix(in srgb, var(--res) 45%, transparent); border-radius: 99px; padding: 0 var(--s2); white-space: nowrap; }
.caption .d, .card .d { margin: 0; color: var(--muted); max-width: 95ch; }
.inh { margin: 0; font-size: var(--t-xs); color: var(--muted); font-style: italic; }
.after-line { margin: 0; font-size: var(--t-xs); color: var(--muted); font-family: var(--font-mono); overflow-wrap: anywhere; }
.after-k { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.check { border: 2px dashed var(--accent); border-radius: var(--r-sm); padding: var(--s2) var(--s3); display: grid; gap: 6px; justify-items: start; background: var(--soft); }
.check b { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); }
.check p { margin: 0; font-weight: 600; }
.check.done { border-style: solid; border-color: var(--good); background: var(--goodsoft); }
.check.done b { color: var(--good); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); border-block: 1px solid var(--line); }
.stat { padding: var(--s2) 20px; display: grid; min-width: 0; border-inline-end: 1px solid var(--line); }
.stat.wide { grid-column: span 2; }
.stat span { font-size: 11.5px; font-weight: 650; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); overflow-wrap: anywhere; }
.stat b { font-size: var(--t-lg); font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat.wide b { font: 600 14px var(--font-mono); }
.svgbox, .mapfig, .card-map { margin: 0; padding: var(--s2); min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px var(--s4); padding: var(--s2) 20px var(--s3); font-size: var(--t-xs); color: var(--muted); border-top: 1px solid var(--line); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; }
.legend .dot { border-radius: 50%; }
.legend .dot.req { background: var(--req); }
.legend .dot.res { background: var(--res); }
.legend .card { width: 20px; border-radius: 3px; background: var(--jobsoft); border: 1.5px solid var(--job); }
.legend .sq { border-radius: 3px; background: var(--job); }
.legend .hatchsw { width: 20px; border-radius: 3px; border: 1px solid var(--bad); background: repeating-linear-gradient(45deg, var(--hatch) 0 2px, var(--badsoft) 2px 6px); }
.legend .hz { border-radius: 50%; background: var(--bad); }
.legend .failsw { width: 20px; border-radius: 3px; border: 2px solid var(--bad); background: var(--badsoft); }
.legend .dashsw { width: 20px; border-radius: 3px; border: 2px dashed var(--req); }
.legend .ctxsw { width: 20px; border-radius: 3px; border: 1.5px dashed var(--line-strong); }
.legend .plus { color: var(--job); font: 700 12px var(--font-mono); }

/* the map */
svg.map { display: block; width: 100%; height: auto; margin-inline: auto; }
svg.map.narrow { max-height: none; }
.zone { font: 600 11px var(--font-mono); fill: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; }
.edge.data { stroke-dasharray: 2 4; }
.edge.feed { stroke-dasharray: 5 4; }
.node .box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.5; transition: stroke var(--dur), fill var(--dur); }
.node.r-client .box, .node.r-external .box { fill: var(--surface-2); }
.node.r-queue .box, .node.r-cache .box, .node.r-store .box, .node.r-worker .box { fill: var(--surface-2); }
.node.ctx .box { stroke-dasharray: 5 4; stroke: var(--line); }
.node.ctx .lbl { fill: var(--muted); }
.node.on .box { stroke: var(--req); stroke-width: 2.5; fill: var(--soft); }
.node.on.dash .box { stroke-dasharray: 6 4; }
.node.failed .box { stroke: var(--bad); stroke-width: 2.5; fill: var(--badsoft); }
.node.pulse .box { animation: pulse 0.45s ease-out; }
.node.shake { animation: shake 0.4s ease-in-out; }
@keyframes pulse { 0% { stroke-width: 7; } 100% { stroke-width: 2.5; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.lbl { font: 600 13.5px var(--font-body); fill: var(--fg); }
.sub { font: 400 10.5px var(--font-mono); fill: var(--muted); }
.meta { font: 600 11px var(--font-mono); fill: var(--muted); }
.empty { font: italic 400 12px var(--font-body); fill: var(--muted); }
.more { font: 700 12px var(--font-mono); fill: var(--job); }
.faillbl { font: 600 11px var(--font-mono); fill: var(--bad); }
.chip rect { fill: var(--jobsoft); stroke: var(--job); stroke-width: 1.5; }
.chip text { font: 500 10.5px var(--font-mono); fill: var(--fg); }
.slot { fill: var(--idle); stroke: var(--line-strong); stroke-width: 1; transition: fill var(--dur); }
.slot.busy { fill: var(--job); stroke: var(--job); }
.row { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.row.chg { fill: var(--soft); stroke: var(--req); }
.row.stale { stroke: var(--bad); }
.row.hazard { stroke: var(--bad); stroke-width: 2.5; }
.row.ghost { fill: none; stroke: var(--good); stroke-dasharray: 4 3; }
.hatch { pointer-events: none; opacity: 0.55; }
.hatch-bg { fill: var(--badsoft); }
.hatch-line { stroke: var(--hatch); stroke-width: 3; }
.key { font: 500 11px var(--font-mono); fill: var(--muted); }
.val { font: 600 11.5px var(--font-mono); fill: var(--fg); }
.val.skipped { fill: var(--good); font-style: italic; }
.stale-tag { font: 700 9.5px var(--font-mono); fill: var(--bad); text-transform: uppercase; letter-spacing: 0.06em; }
.hz-mark { fill: var(--bad); }
.hz-mark-t { font: 800 12px var(--font-mono); fill: var(--surface); }
.badge { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.5; }
.badge.hit { fill: var(--goodsoft); stroke: var(--good); }
.badge.miss { fill: var(--jobsoft); stroke: var(--job); }
.badge.failed { fill: var(--bad); stroke: var(--bad); }
.badge-t { font: 700 10.5px var(--font-mono); fill: var(--fg); letter-spacing: 0.05em; }
.badge-t.failed { fill: var(--surface); }
.ttl { fill: var(--bad); }
.guide { fill: none; stroke: none; }
.dot { stroke: var(--surface); stroke-width: 2; }
.dot.req { fill: var(--req); } .dot.res { fill: var(--res); } .dot.job { fill: var(--job); } .dot.data { fill: var(--req); }
.atag { font: 600 11px var(--font-mono); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.atag.req, .atag.data { fill: var(--req); } .atag.res { fill: var(--res); } .atag.job { fill: var(--job); }
.arrow path { fill: none; stroke-width: 2.5; }
.arrow.req path { stroke: var(--req); }
.arrow.res path { stroke: var(--res); }
.arrow.job path { stroke: var(--job); stroke-dasharray: 5 4; }
.arrow.data path { stroke: var(--req); stroke-dasharray: 2 4; stroke-linecap: round; }
.abadge circle { fill: var(--c); stroke: var(--surface); stroke-width: 2; }
.abadge text { font: 700 10.5px var(--font-mono); fill: var(--surface); }
.abadge.req, .abadge.data, .moves .req, .moves .data { --c: var(--req); }
.abadge.res, .moves .res { --c: var(--res); }
.abadge.job, .moves .job { --c: var(--job); }
.moves { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 13px; }
.moves li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; align-items: start; }
.mv-n { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--c); color: var(--surface); font: 700 10.5px var(--font-mono); margin-top: 1px; }
.mv-t { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; min-width: 0; }
.mv-t code { color: var(--c); font-weight: 600; }
.mv-ft { color: var(--muted); font-size: 12px; }
.caption .moves { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); column-gap: var(--s4); }
.arrowhead.req, .arrowhead.data { fill: var(--req); } .arrowhead.res { fill: var(--res); } .arrowhead.job { fill: var(--job); }

/* step list */
.steps-panel { padding: var(--s3); display: grid; gap: var(--s2); min-width: 0; }
.steps-panel > * { min-width: 0; overflow-wrap: anywhere; }
.steps-panel h2, .panel > h2 { font-size: var(--t-md); font-weight: 700; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.step-btn { width: 100%; display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; align-items: start; text-align: start; padding: 7px var(--s2); border: 0; border-inline-start: 3px solid transparent; border-radius: var(--r-sm); background: none; color: var(--muted); font: 14px/1.4 var(--font-body); cursor: pointer; min-height: 32px; transition: background-color var(--dur); }
.step-btn:hover { background: var(--surface-2); }
.step-btn .n { font-size: 12px; font-weight: 650; line-height: 1.7; font-variant-numeric: tabular-nums; }
.step-btn.done { color: var(--fg); }
.step-btn.cur { background: var(--soft); color: var(--fg); font-weight: 650; border-inline-start-color: var(--accent); }
.step-btn.inferred { border-inline-start: 3px dashed var(--line-strong); }
.step-btn.inferred.cur { border-inline-start-color: var(--accent); }
.step-btn.inh .t { font-style: italic; }
.mk { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font: 700 11px var(--font-body); color: var(--surface); margin-inline-start: 2px; }
.mk.hz, .mk.fl { background: var(--bad); }
.mk.sk { background: var(--good); }
.mk.ck { background: var(--accent); }

/* panels */
.panel { padding: 18px 20px; display: grid; gap: var(--s3); }
.tbl { overflow-x: auto; }
.ref-file + .ref-file { margin-top: 1.25rem; }
.ref-file h3 { margin: 0.75rem 0 0.25rem; font-size: 1rem; }
.ref-file td .muted code { font-size: 0.85em; }
.ref-file td:first-child code { white-space: nowrap; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: start; padding: 8px var(--s2); border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; font-weight: 650; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
.sev { display: inline-block; font: 700 11.5px/1.7 var(--font-body); text-transform: uppercase; letter-spacing: 0.04em; border-radius: 99px; padding: 0 var(--s2); color: var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); white-space: nowrap; }
.s-low { --c: var(--muted); } .s-medium { --c: var(--job); } .s-high { --c: var(--bad); }
.s-critical { --c: var(--bad); background: var(--bad); color: var(--surface); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: var(--s3); }
.opt { border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s4); display: grid; gap: var(--s2); align-content: start; }
.opt.chosen { border: 2px solid var(--good); background: var(--goodsoft); }
.opt.fails { background: var(--surface-2); }
.opt-head { display: flex; flex-wrap: wrap; gap: 6px var(--s2); align-items: center; }
.opt-head h3 { font-size: var(--t-sm); flex: 1 1 100%; }
.fit { font: 700 11.5px/1.7 var(--font-body); text-transform: uppercase; letter-spacing: 0.04em; border-radius: 99px; padding: 0 var(--s2); border: 1px solid; }
.f-pass { color: var(--good); } .f-fail { color: var(--bad); }
.chosen-b { font: 700 11.5px/1.7 var(--font-body); text-transform: uppercase; letter-spacing: 0.04em; border-radius: 99px; padding: 0 var(--s2); background: var(--good); color: var(--surface); }
.pc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s3); }
.pc h4 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
.pc ul { margin: 0; padding-inline-start: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; }
.pros li::before { content: "+ "; color: var(--good); font-weight: 700; }
.cons li::before { content: "− "; color: var(--bad); font-weight: 700; }
.dec { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: var(--s3); }
.dec dt { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.dec dd { margin: 2px 0 0; }
.errorbox { border: 2px solid var(--bad); background: var(--badsoft); border-radius: var(--r-sm); padding: var(--s3); display: grid; gap: 6px; }
.foot { color: var(--muted); font-size: var(--t-xs); }
.foot p { margin: 0; }

/* compare */
.race-head { display: flex; flex-wrap: wrap; gap: var(--s3); justify-content: space-between; align-items: flex-start; }
.race-head p { margin: 4px 0 0; max-width: 90ch; }
.compare h2 { font-size: var(--t-lg); }
.clock { font-size: var(--t-xl); font-weight: 700; font-variant-numeric: tabular-nums; }
svg.race { display: block; width: 100%; height: auto; }
.rgrp { font: 700 14px var(--font-body); fill: var(--fg); }
.rlab, .rmile, .rgrp { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.rlab { font: 400 12.5px var(--font-body); fill: var(--fg); }
.rtick { font: 400 11px var(--font-body); fill: var(--muted); }
.rgrid { stroke: var(--line); stroke-width: 1; }
.rhead { stroke: var(--res); stroke-width: 2; }
.rtrack { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
.rbar { stroke-width: 1.5; }
.rbar.l0 { fill: var(--l0); stroke: var(--l0); } .rbar.l1 { fill: var(--l1); stroke: var(--l1); }
.rbar.l2 { fill: var(--l2); stroke: var(--l2); } .rbar.l3 { fill: var(--l3); stroke: var(--l3); }
.rbar.est { fill-opacity: 0.5; stroke-dasharray: 4 3; }
.rbar.bad { stroke: var(--bad); stroke-width: 2.5; }
.rtag { font: 600 10.5px var(--font-body); fill: var(--c, var(--muted)); }
.rmark { fill: var(--res); }
.rmile { font: 600 11px var(--font-body); fill: var(--fg); }
.rbad { fill: var(--bad); }
.rcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: var(--s3); }
.rcard { border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: var(--r-md); padding: var(--s3) var(--s4); display: grid; gap: var(--s2); }
.rcard.l0 { --c: var(--l0); } .rcard.l1 { --c: var(--l1); } .rcard.l2 { --c: var(--l2); } .rcard.l3 { --c: var(--l3); }
.rcard h3 { font-size: var(--t-sm); }
.rvals { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: var(--s2); }
.rvals span { display: block; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); overflow-wrap: anywhere; }
.rvals b { font-size: var(--t-lg); font-variant-numeric: tabular-nums; }

/* before you watch */
.before h3, .card-code h4 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 6px; }
.why { margin: 0; color: var(--muted); max-width: var(--measure); }
.why b { color: var(--fg); }
.scopes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: var(--s4); }
.scope { padding-inline-start: var(--s3); border-inline-start: 3px solid var(--good); display: grid; gap: 6px; justify-items: start; align-content: start; }
.scope.s-outScope { border-inline-start-style: dashed; border-inline-start-color: var(--line-strong); }
.scope ul { margin: 0; padding-inline-start: 18px; display: grid; gap: 4px; max-width: var(--measure); }
.eps { display: grid; gap: 6px; justify-items: start; }
.eps .tbl { width: 100%; }
.btn.sm { min-height: 28px; padding: 3px 10px; font-size: 12.5px; }
.terms { display: grid; gap: var(--s2); justify-items: start; }
.term-cloud { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: var(--s2); }
.terms dl { margin: 0; width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: var(--s2) var(--s4); }
.terms dt { font-weight: 700; font-size: 14px; }
.terms dd { margin: 0; color: var(--muted); font-size: 14px; }
.term { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: help; text-decoration: underline dotted var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.term.open { background: var(--soft); border-radius: 3px; }
.term.chip-term { font-size: 14px; font-weight: 550; text-decoration: none; min-height: 30px; padding: 3px 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; transition: border-color var(--dur), background-color var(--dur); }
.term.chip-term:hover, .term.chip-term.open { border-color: var(--accent); background: var(--accent-soft); }
.term-tip { position: absolute; z-index: 20; max-width: min(340px, calc(100vw - 2 * var(--s2))); background: var(--fg); color: var(--bg); border-radius: var(--r-sm); padding: var(--s2) var(--s3); font: 13.5px/1.5 var(--font-body); display: grid; gap: 4px; box-shadow: var(--shadow-md); }
.term-tip code { color: var(--bg); }

/* origin and WHAT-IF */
.stage-origin { padding: var(--s3) 20px 0; }
.banner.origin.o-what-if { background: var(--jobsoft); border: 1.5px dashed var(--job); }
.banner.origin.o-what-if b { background: var(--job); }
.banner.origin.o-found-in-review { background: var(--soft); border-color: var(--accent); }
.banner.origin.o-found-in-review b { background: var(--accent); }
.banner.origin.o-in-code b { background: var(--good); }
.wi { display: inline-block; white-space: nowrap; font: 700 11.5px/1.7 var(--font-body); letter-spacing: 0.04em; color: var(--job); background: color-mix(in srgb, var(--job) 10%, transparent); border: 1.5px dashed var(--job); border-radius: 99px; padding: 0 var(--s2); }
.tabs [role="tab"][aria-selected="true"] .wi { color: var(--surface); border-color: currentColor; background: transparent; }

/* workflow outline */
.ol { display: grid; gap: 4px; }
.ol h3 code { font-size: 14px; }
.ol-lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.ol-line { width: 100%; min-height: 26px; display: flex; flex-wrap: wrap; gap: 2px var(--s3); justify-content: space-between; align-items: baseline; text-align: start; padding: 3px var(--s2); padding-inline-start: calc(var(--s2) + var(--ind, 0) * 2ch); border: 0; border-inline-start: 3px solid transparent; border-radius: var(--r-sm); background: none; color: var(--fg); font: 13px/1.5 var(--font-mono); text-decoration: none; transition: background-color var(--dur); }
button.ol-line, a.ol-line { cursor: pointer; }
button.ol-line:hover, a.ol-line:hover { background: var(--surface-2); }
.ol-line code { font-size: inherit; white-space: pre-wrap; }
.ol-line.inferred { border-inline-start: 3px dashed var(--line-strong); }
.ol-line.cur { background: var(--soft); border-inline-start-color: var(--accent); font-weight: 700; }
.ol-n { color: var(--muted); font: 12px var(--font-body); white-space: nowrap; }

/* page body: Contents beside (>= 1200px) or above the sections */
.doc { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s5); align-items: start; min-width: 0; }
.doc-main { container: doc / inline-size; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s5); min-width: 0; }
.doc-main > * { min-width: 0; }

/* contents: a book-index card, one row per section */
.contents { gap: var(--s2); }
.toc-head { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s3); justify-content: space-between; align-items: center; }
.toc-head h2 { font-size: var(--t-md); font-weight: 700; }
.toc-tools { display: flex; flex-wrap: wrap; gap: var(--s2); }
.contents.collapsed .toc, .contents.collapsed .toc-tools { display: none; }
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc a { display: grid; grid-template-columns: auto minmax(var(--s4), 1fr) auto; column-gap: var(--s2); align-items: baseline; padding: 6px var(--s2); border-radius: var(--r-sm); border-inline-start: 3px solid transparent; color: var(--fg); text-decoration: none; transition: background-color var(--dur); }
.toc a:hover { background: var(--surface-2); }
.toc a:hover .toc-t { text-decoration: underline; }
.toc a[aria-current] { background: var(--accent-soft); border-inline-start-color: var(--accent); }
.toc a[aria-current] .toc-t { color: var(--fg); }
.toc-t { font-weight: 650; color: var(--accent); text-underline-offset: 2px; }
.toc-lead { align-self: end; margin-bottom: 0.4em; border-bottom: 2px dotted var(--line); }
.toc-n { font-size: 12.5px; color: var(--muted); text-align: end; font-variant-numeric: tabular-nums; }
.toc-w { grid-column: 1 / -1; font-size: var(--t-xs); color: var(--muted); line-height: 1.45; }

/* folding sections: the heading is the summary */
.fold.panel { display: block; }
.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: var(--s2); min-height: 32px; border-radius: var(--r-sm); }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::before { content: ""; flex: none; width: 0.5em; height: 0.5em; margin-inline: 2px 4px; border-inline-end: 2px solid var(--muted); border-block-end: 2px solid var(--muted); transform: rotate(-45deg); transition: transform var(--dur); }
.fold[open] > summary::before { transform: rotate(45deg); }
.fold > summary h2 { display: flex; align-items: center; gap: 10px; font-size: var(--t-lg); font-weight: 700; letter-spacing: -0.005em; }
.fold > summary h2::before { content: ""; flex: none; width: 4px; height: 1.1em; border-radius: 2px; background: var(--accent); }
.fold > summary:hover h2 { text-decoration: underline; text-underline-offset: 3px; }
.fold-body { display: grid; gap: var(--s4); min-width: 0; margin-top: var(--s4); }
.fold.bare > .fold-body { gap: var(--s4); }
.fold.bare > summary { padding-inline: var(--s2); }
.fold { scroll-margin-top: var(--s3); }

/* diagrams: beside the outline on a wide column */
.pair { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s4); align-items: start; }
.dg { margin: 0; display: grid; gap: var(--s2); min-width: 0; }
.dg-title { font-size: var(--t-sm); }
.dg-box { overflow: auto; min-height: 160px; padding: var(--s2); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.dg.inferred .dg-box { border: 2px dashed var(--line-strong); }
.dg-box svg { display: block; height: auto; margin-inline: auto; }
.dg-wait { margin: 0; }
.dg-note { margin-bottom: var(--s2); }
.dg-src { margin: 0; font: 12.5px/1.5 var(--font-mono); white-space: pre; }
.dg-src code { font-size: inherit; overflow-wrap: normal; }
.dg-cap { display: grid; gap: 6px; font-size: 14px; }
.dg-cap p { margin: 0; }
@container doc (max-width: 1099px) { .dg-wide { display: none; } }
.dg-ev summary { cursor: pointer; font-size: 12.5px; color: var(--muted); min-height: 24px; }
.dg-ev .chips { margin-top: 6px; }
.dg-cap > p:first-child { color: var(--muted); max-width: 95ch; }

/* code pane and code blocks */
.codepane { gap: var(--s2); align-content: start; }
.code-head { display: flex; flex-wrap: wrap; gap: var(--s2); justify-content: space-between; align-items: center; }
.code-head h2 { font-size: var(--t-md); font-weight: 700; }
.code-body { display: grid; gap: var(--s3); min-width: 0; }
.code-body > p { margin: 0; }
.pseudo { min-width: 0; }
.src { margin: 0 0 4px; font-size: 12px; }
.pseudo pre, .snip pre { margin: 0; overflow-x: auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); font: 12.5px/1.55 var(--font-mono); }
.pseudo pre { padding: var(--s2) var(--s3); }
.snip pre { padding: var(--s2) 0; }
.pseudo code { font-size: inherit; white-space: pre-wrap; overflow-wrap: anywhere; }
.snip code { font-size: inherit; overflow-wrap: normal; white-space: pre; }
.snip code { display: block; min-width: max-content; }
.snip { margin: 0; display: grid; gap: 4px; min-width: 0; }
.snip figcaption { display: flex; flex-wrap: wrap; gap: var(--s2); font-size: 12px; }
.ln { display: block; padding-inline: var(--s2) var(--s3); border-inline-start: 3px solid transparent; }
.ln.hl { background: var(--jobsoft); border-inline-start-color: var(--job); font-weight: 700; }
.lno { display: inline-block; min-width: 3ch; margin-inline-end: 1.5ch; text-align: end; color: var(--muted); user-select: none; font-weight: 400; }
.card-code { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: var(--s2); min-width: 0; }
.card-code summary { cursor: pointer; font-weight: 600; font-size: 14px; min-height: 24px; }
.card-code h4 { margin-top: var(--s2); }
.card-code .snip + .snip { margin-top: var(--s2); }

/* light tier */
.scenario { display: grid; gap: var(--s3); }
.sc-head { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s3); align-items: baseline; padding-top: var(--s3); border-top: 2px solid var(--line); }
.sc-head h2 { font-size: var(--t-lg); }
.fixline { margin: 0; color: var(--muted); }
.cards { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s3); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-sm); display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: var(--s2) var(--s4); padding: var(--s4); scroll-margin-top: var(--s4); }
.card.stack { grid-template-columns: minmax(0, 1fr); }
.card.inferred { border-style: dashed; border-color: var(--line-strong); }
.card.has-hazard { border: 2px solid var(--bad); }
.card:target { outline: 3px solid var(--accent); }
.card-text { display: grid; gap: var(--s2); align-content: start; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: baseline; }
.card-head h3 { font-size: var(--t-md); }
.after { display: grid; gap: 4px; font-size: var(--t-xs); }
.after ul { margin: 0; padding-inline-start: 18px; display: grid; gap: 2px; }
.card-map { padding: 0; align-self: center; }
.same { color: var(--muted); }
.same p { margin: 0; }

/* the walkthrough and cards follow the width of the content column, not the window */
@container doc (max-width: 1100px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .side { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
}
/* code beside the diagram on a wide column; below it otherwise (the DOM order) */
@container doc (min-width: 1100px) {

<script>/* 100x flow player: the reducer and both renderers (light step cards, heavy animated player)
   for a page written by `100x flow build`. Vanilla JS, no dependencies, no network. The
   scenario arrives as JSON in #flow-data; rendering is a function of the reduced state, so
   Back, deep links (#<scenario>.<step>) and the before/after toggle replay nothing by hand. */
(function () {
"use strict";

/* ============ reducer: mirrors scripts/flow.py reduce_scenario (tests/flow/states.json) ============ */

const TIME_UNITS_MS = { ms: 1, s: 1000, min: 60000, h: 3600000 };
const DEFAULT_READ_VAR = "read";
const ONE_PLACEHOLDER = /^\{\{\s*([^}]*?)\s*\}\}$/;
// flow.py AT_RX: a path may hold '@' (packages/@scope/x.ts); only a trailing @<7-40 hex> is the revision.
const AT_RX = /^([^:]+):([1-9][0-9]*)(?:@([0-9a-f]{7,40}))?$/;
function parseAt(at) {
  const m = typeof at === "string" ? AT_RX.exec(at) : null;
  return m ? { path: m[1], line: m[2], rev: m[3] || null } : null;
}

class ReduceError extends Error {}

const own = (o, k) => o != null && Object.prototype.hasOwnProperty.call(o, k);
const get = (o, k) => (own(o, k) ? o[k] : null);
const clone = x => JSON.parse(JSON.stringify(x));
const same = (a, b) => JSON.stringify(a === undefined ? null : a) === JSON.stringify(b === undefined ? null : b);
// Keys come from the scenario; defineProperty keeps a key such as "__proto__" an ordinary key.
function put(o, k, v) { Object.defineProperty(o, k, { value: v, enumerable: true, writable: true, configurable: true }); }

function scenarioIndex(doc) { const m = {}; for (const s of doc.scenarios) put(m, s.id, s); return m; }

function effectiveSteps(sid, scenarios, seen) {
  seen = seen || [];
  if (seen.includes(sid)) throw new ReduceError("branch cycle: " + seen.concat([sid]).join(" -> "));
  const s = scenarios[sid];
  const mine = s.steps.map((step, index) => ({ step, origin: sid, index }));
  if (!s.branch) return mine;
  const parent = effectiveSteps(s.branch.from, scenarios, seen.concat([sid]));
  if (s.branch.at > parent.length) {
    throw new ReduceError(`scenario ${sid}: branch.at ${s.branch.at} is past the ${parent.length} step(s) of ${s.branch.from}`);
  }
  return parent.slice(0, s.branch.at).concat(mine);
}

function initialState(doc) {
  const init = doc.initial || {}, caches0 = init.caches || {}, stores0 = init.stores || {};
  const st = { clock_ms: 0, queues: {}, workers: {}, caches: {}, stores: {}, vars: {}, counters: {}, failed: [] };
  for (const n of doc.nodes) {
    if (n.role === "queue") put(st.queues, n.id, []);
    else if (n.role === "worker") put(st.workers, n.id, new Array(n.slots || 1).fill(null));
    else if (n.role === "cache") {
      const c = {}, kv = get(caches0, n.id) || {};
      for (const k of Object.keys(kv)) put(c, k, { v: kv[k], stale: false, src: null });
      put(st.caches, n.id, c);
    } else if (n.role === "store") {
      const c = {}, kv = get(stores0, n.id) || {};
      for (const k of Object.keys(kv)) put(c, k, kv[k]);
      put(st.stores, n.id, c);

function msOf(placeholder, numbers) {
  const n = numbers[ONE_PLACEHOLDER.exec(placeholder)[1]];
  return Math.round(n.v * TIME_UNITS_MS[n.unit]);
}

function boundVar(state, ref, action) {
  const v = get(state.vars, ref.slice(1));
  if (v === null) throw new ReduceError(`${action}: variable '${ref}' is unbound`);
  return v;
}

const isRef = v => typeof v === "string" && v.startsWith("$");

function applyAction(state, out, action, numbers) {
  const name = action[0], args = action.slice(1);
  const touch = id => { if (!out.active.includes(id)) out.active.push(id); };
  if (name === "send" || name === "reply") {
    touch(args[0]); touch(args[1]);
    out.messages.push({ kind: name, from: args[0], to: args[1], label: args.length > 2 ? args[2] : null });
    return;
  }
  if (name !== "wait" && name !== "counter" && name !== "note") touch(args[0]);

    case "enqueue": state.queues[args[0]].push(args[1]); break;
    case "pickup": {
      touch(args[1]);
      const q = state.queues[args[0]], slots = state.workers[args[1]], free = slots.indexOf(null);
      if (!q.length) throw new ReduceError(`pickup: queue '${args[0]}' is empty`);
      if (free < 0) throw new ReduceError(`pickup: worker '${args[1]}' has no free slot`);
      slots[free] = q.shift();
      break;

      if (at < 0) throw new ReduceError(`free: worker '${args[0]}' holds no job` + (args.length > 1 ? ` '${args[1]}'` : ""));
      slots[at] = null;
      break;
    }
    case "cache.get": out.hit = own(state.caches[args[0]], args[1]) ? "hit" : "miss"; break;

      if (isRef(value)) { const v = boundVar(state, value, "cache.set"); value = v.v; src = v.src; }

        const current = get(state.stores[src[0]], src[1]);
        if (!same(current, value)) {
          stale = true;
          out.hazards.push({ kind: "stale-writeback", cache, key, store: src[0], store_key: src[1] });
        }
      }
      put(state.caches[cache], key, { v: value, stale, src });
      break;
    }
    case "cache.set-if-fresh": {
      const cache = args[0], key = args[1], v = boundVar(state, args[2], "cache.set-if-fresh");
      const current = get(state.stores[v.src[0]], v.src[1]);
      if (same(current, v.v)) put(state.caches[cache], key, { v: v.v, stale: false, src: v.src });
      else out.skipped.push({ cache, key, store: v.src[0], store_key: v.src[1], read: v.v, current });
      break;
    }
    case "cache.del": case "cache.expire": delete state.caches[args[0]][args[1]]; break;
    case "mark-stale": {
      const e = get(state.caches[args[0]], args[1]);
      if (e === null) throw new ReduceError(`mark-stale: cache '${args[0]}' has no key '${args[1]}'`);
      e.stale = true;
      break;
    }
    case "db.read":
      put(state.vars, args.length > 2 ? args[2] : DEFAULT_READ_VAR,
          { v: get(state.stores[args[0]], args[1]), src: [args[0], args[1]] });
      break;
    case "db.write": {
      const store = args[0], skey = args[1];
      let value = args[2];
      if (isRef(value)) value = boundVar(state, value, "db.write").v;
      put(state.stores[store], skey, value);
      for (const entries of Object.values(state.caches)) {
        for (const e of Object.values(entries)) {
          if (e.src && e.src[0] === store && e.src[1] === skey && !same(e.v, value)) e.stale = true;
        }
      }
      break;
    }
    case "wait": state.clock_ms += msOf(args[0], numbers); break;
    case "counter": put(state.counters, args[0], (get(state.counters, args[0]) || 0) + args[1]); break;
    case "fail":
      if (!state.failed.includes(args[0])) state.failed.push(args[0]);
      out.failures.push({ node: args[0], label: args.length > 1 ? args[1] : null });
      break;
    case "note": out.notes.push(args[0]); break;
    default: throw new ReduceError(`unknown action '${name}'`);
  }
}

const newOut = () => ({ active: [], messages: [], hit: null, failures: [], notes: [], hazards: [], skipped: [] });

function snapshot(i, entry, sid, state, out) {
  const s = clone(state), o = clone(out);
  return {
    step: i, origin: entry.origin, origin_step: entry.index, inherited: entry.origin !== sid,
    clock_ms: s.clock_ms, active: o.active, messages: o.messages, hit: o.hit,
    queues: s.queues, workers: s.workers, caches: s.caches, stores: s.stores, vars: s.vars,
    counters: s.counters, failed: s.failed, failures: o.failures, notes: o.notes,
    hazards: o.hazards, skipped: o.skipped,
  };
}

function reduceScenario(doc, sid) {
  const scenarios = scenarioIndex(doc), numbers = doc.numbers || {};
  const state = initialState(doc);
  return effectiveSteps(sid, scenarios).map((entry, i) => {
    const out = newOut();
    for (const a of entry.step.do) {
      try { applyAction(state, out, a, numbers); } catch (err) {
        if (err instanceof ReduceError) throw new ReduceError(`scenario ${entry.origin} step ${entry.index}: ${err.message}`);
        throw err;
      }
    }
    return snapshot(i, entry, sid, state, out);
  });
}

/* ============ page data helpers: terms, outline links, real-code snippets (no DOM) ============ */

const escapeRx = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
// Text split into plain strings and {term, i} hits, i indexing terms. A hit is a whole word in
// any case; the prefix group stands in for a lookbehind, which older Safari cannot parse.
function splitTerms(text, terms) {
  const names = (terms || []).map((t, i) => ({ s: String((t && t.term) || ""), i })).filter(t => t.s)
    .sort((a, b) => b.s.length - a.s.length);
  if (!names.length || !text) return [text];
  const termRx = new RegExp(`(^|[^\\w])(${names.map(t => escapeRx(t.s)).join("|")})(?![\\w])`, "gi");
  const out = [];
  let last = 0, m;
  while ((m = termRx.exec(text))) {
    const at = m.index + m[1].length, word = m[2].toLowerCase();
    if (at > last) out.push(text.slice(last, at));
    out.push({ term: m[2], i: names.find(t => t.s.toLowerCase() === word).i });
    last = at + m[2].length;
    termRx.lastIndex = last;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}

// The outline lines {o, l} that point at effective step i of scenario sid. A line's step index is
// read in its own scenario, and steps match by identity, so a fix's inherited step lights the
// issue's line for that same step.
function outlineHits(outline, entries, sid, i) {
  const cur = (entries[sid] || [])[i], hits = [];
  if (!cur) return hits;
  (outline || []).forEach((o, oi) => (o.lines || []).forEach((ln, li) => {
    const theirs = entries[o.scenario] || [];
    if ((ln.steps || []).some(j => theirs[j] && theirs[j].step === cur.step)) hits.push({ o: oi, l: li });
  }));
  return hits;
}

// The real-code snippets `flow build` attached to a step's evidence; a malformed one is skipped.
function stepSnippets(step, snippets) {
  const out = [];
  for (const eid of step.ev || []) {
    const s = get(snippets, eid);
    const lines = s && Array.isArray(s.lines) && s.lines.length && s.lines.every(l => typeof l === "string");
    if (lines && typeof s.path === "string" && Number.isInteger(s.start) && s.start >= 1 && Number.isInteger(s.hl)) {
      out.push({ ev: eid, path: s.path, sha: typeof s.sha === "string" ? s.sha : "", start: s.start, lines: s.lines, hl: s.hl });
    }
  }
  return out;
}

function stepTag(step) { return step.tag === "inferred" || !(step.ev || []).length ? "inferred" : "verified"; }

/* ============ the summary at the top: purpose, TL;DR cards, confidence (no DOM) ============ */

const SEVERITY_RANK = ["critical", "high", "medium", "low"];
// A Text (string or {en, ja}) or an outline title {code} as one comparable string; "" when empty.
function textKey(v) {
  if (v == null) return "";
  if (typeof v === "string") return v.trim();
  if (own(v, "code")) { const k = textKey(v.code); return k && "code:" + k; }
  return typeof v.en === "string" ? v.en.trim() : "";
}
function worstIssue(doc) {
  let worst = null;
  for (const s of doc.scenarios || []) {
    const r = SEVERITY_RANK.indexOf(s.severity);
    if (r >= 0 && (!worst || r < SEVERITY_RANK.indexOf(worst.severity))) worst = s;
  }
  return worst;
}
// The hero's texts: `tldr` when given, else the fallbacks; a text already shown above is not repeated.
function heroSummary(doc) {
  const sub = doc.subject || {}, ctx = doc.context || {};
  const tldr = doc.tldr && typeof doc.tldr === "object" ? doc.tldr : {};
  const first = (...vs) => vs.find(v => textKey(v)) || null;
  const purpose = first(tldr.what, ctx.purpose, sub.lede); // the TL;DR's "what" is the headline, so no card repeats it
  const used = new Set([textKey(purpose)]);
  const fresh = v => { const k = textKey(v); if (!k || used.has(k)) return null; used.add(k); return v; };
  const ol = (doc.outline || []).find(o => o && textKey(o.title));
  const what = fresh(first(tldr.what, ctx.purpose, sub.lede));
  const how = fresh(first(tldr.how, ol ? { code: ol.title } : null, sub.lede));
  const worst = worstIssue(doc);
  const watch = textKey(tldr.watch_out) ? { text: tldr.watch_out } : worst ? { issue: worst.id, severity: worst.severity } : null;
  return { purpose, what, how, watch, lede: fresh(sub.lede) };
}
function confidenceOf(doc) {
  let verified = 0, total = 0;
  for (const s of doc.scenarios || []) for (const st of s.steps || []) { total++; if (stepTag(st) === "verified") verified++; }
  return { verified, total };
}

const API = { reduceScenario, effectiveSteps, initialState, applyAction, newOut, ReduceError, parseAt, splitTerms, outlineHits, stepSnippets,
              heroSummary, worstIssue, confidenceOf };
if (typeof module === "object" && module && module.exports) module.exports = API;

// Replays one step's actions from the state before it and returns every arrow it draws.

/* ============ heavy tier: the animated player ============ */

const CANCEL = { cancel: true };
const PL = { sid: null, i: 0, playing: false, tk: { off: false }, revealed: new Set(), wasAuto: false, M: null, rafs: new Set() };
const reduced = () => P.reducedMotion;
const speed = () => +(($("speed") || {}).value || 1);

// (headless browsers, some embedded viewers); whichever fires first wins.
const FRAME_FALLBACK_MS = 32;
function nextFrame(cb) {

  const raf = requestAnimationFrame(run), tm = setTimeout(run, FRAME_FALLBACK_MS);

}
const ease = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

function tween(ms, fn) {
  const tk = PL.tk;
  if (tk.off) { const p = Promise.reject(CANCEL); p.catch(() => {}); return p; }
  if (reduced() || !ms) { fn(1); return Promise.resolve(); }
  ms /= speed();
  const p = new Promise((res, rej) => {
    const t0 = performance.now();
    (function f() {
      if (tk.off) return rej(CANCEL);
      const t = Math.min(1, (performance.now() - t0) / ms);
      fn(ease(t));
      t < 1 ? nextFrame(f) : res();
    })();
  });
  p.catch(() => {});
  return p;
}
function hold(ms) {
  const tk = PL.tk;
  if (tk.off) { const p = Promise.reject(CANCEL); p.catch(() => {}); return p; }
  const p = new Promise((res, rej) => {
    const t0 = performance.now(), dur = ms / speed();
    (function f() { if (tk.off) return rej(CANCEL); performance.now() - t0 >= dur ? res() : nextFrame(f); })();
  });
  p.catch(() => {});
  return p;
}
function cancel() {
  PL.tk.off = true;
  PL.tk = { off: false };
  setPlaying(false);
  if (PL.M) { PL.M.layers.dots.replaceChildren(); PL.M.layers.chips.replaceChildren(); }
}
function setPlaying(on) {
  PL.playing = on;
  const b = $("play");
  if (b) { b.textContent = on ? ui("pause") : ui("play"); b.setAttribute("aria-pressed", String(on)); }
}

function pulse(id) {
  const N = PL.M && PL.M.nodes[id];
  if (!N || reduced()) return;
  N.g.classList.remove("pulse");
  void N.g.getBBox();
  N.g.classList.add("pulse");
}

async function flyPath(d, kind, tag) {
  const M = PL.M;
  const guide = sv("path", { d, class: "guide" }, M.layers.dots);
  const len = guide.getTotalLength();
  const dot = sv("circle", { class: "dot " + kind, r: 6.5 }, M.layers.dots);
  const lab = tag ? sv("text", { class: "atag " + kind, "text-anchor": "middle" }, M.layers.dots, truncate(tag, 28)) : null;
  const at = t => { const pt = guide.getPointAtLength(len * t); dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y); if (lab) { lab.setAttribute("x", pt.x); lab.setAttribute("y", pt.y - 12); lab.setAttribute("opacity", t < TAG_FADE_FROM ? 1 : (1 - t) / (1 - TAG_FADE_FROM)); } };
  at(0);
  try { await tween(Math.max(360, len * 2.4), at); } finally { guide.remove(); dot.remove(); if (lab) lab.remove(); }
}
async function fly(from, to, kind, tag) {
  const L = PL.M.L;
  if (!from || !to || from === to || !L.pos[from] || !L.pos[to]) return;
  await flyPath(edgePath(L.pos[from], L.pos[to], L), kind, tag);
  pulse(to);
}
async function flyChip(from, to, text) {
  const c = chipAt(PL.M.layers.chips, from[0], from[1], text, "flying");
  try {
    await tween(560, e => c.setAttribute("transform", `translate(${from[0] + (to[0] - from[0]) * e},${from[1] + (to[1] - from[1]) * e})`));

}
const centerOf = id => { const p = PL.M.L.pos[id]; return [p.x + p.w / 2 - 27, p.y + p.h / 2 - 11]; };

function liveInfo(out, extra) {
  return Object.assign({ active: out.active, hazards: out.hazards, skipped: out.skipped, failures: out.failures, inferred: PL.inferred }, extra || {});
}

async function animateAction(a, state, out, actor, prev) {
  const M = PL.M, L = M.L, [name, x, y, z] = a;
  const apply = () => applyAction(state, out, a, P.numbers);
  const draw = extra => renderMap(M, state, liveInfo(out, Object.assign({ prev }, extra)));
  switch (name) {
    case "send": case "reply":
      await fly(x, y, name === "send" ? "req" : "res", z != null ? tx(z) : "");
      apply(); draw(); return;
    case "enqueue": {
      const idx = state.queues[x].length;
      apply(); draw({ pending: { queue: x, index: idx } });
      const p = L.pos[x], to = idx < VIS ? qPos(p, idx) : [p.x + p.w - 66, p.y + 34];
      await flyChip(actor && L.pos[actor] ? centerOf(actor) : to, to, y);
      draw(); return;
    }
    case "pickup": {
      const job = state.queues[x][0], k = state.workers[y].indexOf(null);
      const from = qPos(L.pos[x], 0);
      apply(); draw({ pending: { worker: y, slot: k } });
      if (k >= 0 && job != null) {
        const [sx, sy] = slotPos(L.pos[y], k);
        await flyChip(from, [sx + G.slot / 2 - 27, sy + G.slot / 2 - 11], job);
      }
      draw(); pulse(y); return;
    }
    case "free": apply(); draw(); pulse(x); await hold(220); return;
    case "cache.get": {
      const hit = own(state.caches[x], y);
      await fly(actor, x, "req", ui("arrow.get", { key: y, r: "?" }).replace(/ → \?$/, ""));
      apply(); draw({ hit: out.hit, hitCache: x });
      await fly(x, actor, "res", hit ? ui("hit") : ui("miss"));
      return;
    }
    case "cache.set": case "cache.set-if-fresh": {
      const v = isRef(z) ? (get(state.vars, z.slice(1)) || {}).v : z;
      await fly(actor, x, "req", name === "cache.set" ? ui("arrow.set", { key: y, v: valueText(v) }) : ui("arrow.fresh", { key: y }));
      apply(); draw(); pulse(x); return;
    }
    case "cache.del": await fly(actor, x, "req", ui("arrow.del", { key: y })); apply(); draw(); pulse(x); return;
    case "cache.expire": {
      const keys = Object.keys(state.caches[x]), i = keys.indexOf(y), p = L.pos[x];
      if (i >= 0) {
        const bar = sv("rect", { class: "ttl", x: p.x + 8, y: rowY(p, i) + G.rowH - 7, width: p.w - 16, height: 3 }, M.layers.chips);
        try { await tween(900, e => bar.setAttribute("width", (p.w - 16) * (1 - e))); } finally { bar.remove(); }
      }
      apply(); draw(); return;
    }
    case "mark-stale": apply(); draw(); pulse(x); return;
    case "db.read": {
      const v = get(state.stores[x], y);
      await fly(actor, x, "req", ui("arrow.read", { key: y, v: "?" }).replace(/ → \?$/, ""));
      apply(); draw(); await fly(x, actor, "res", valueText(v)); return;
    }
    case "db.write": {
      const v = isRef(z) ? (get(state.vars, z.slice(1)) || {}).v : z;
      await fly(actor, x, "req", ui("arrow.write", { key: y, v: valueText(v) }));
      apply(); draw(); pulse(x); return;
    }
    case "wait": {
      const from = state.clock_ms; apply(); const to = state.clock_ms;
      await tween(900, e => renderStats(state, { clock: from + (to - from) * e }));
      draw(); return;
    }
    case "counter": {
      const from = get(state.counters, x) || 0; apply(); const to = state.counters[x];
      await tween(600, e => renderStats(state, { counter: [x, from + (to - from) * e] }));
      draw(); return;

    case "fail": {

      const N = M.nodes[x];
      if (N && !reduced()) { N.g.classList.remove("shake"); void N.g.getBBox(); N.g.classList.add("shake"); }
      await hold(300); return;
    }

  }
}

async function animateStep(i) {
  const sid = PL.sid, sts = P.states[sid], st = sts[i], entry = P.entries[sid][i];

  if (!reduced()) {
    for (const a of entry.step.do) {
      await animateAction(a, state, out, actor, prev);
      renderStats(state);
      actor = nextActor(a, actor);
    }
  }
  showFinal(i);
}

function finalInfo(sid, i) {

  return { active: st.active, inferred: stepTag(step) === "inferred", hit: st.hit, hitCache: lastGetCache(step), hazards: st.hazards, skipped: st.skipped, failures: st.failures, prev: i ? sts[i - 1] : P.init };

function checkFor(sid, i) { return (P.doc.checks || []).find(c => c.scenario === sid && c.step === i) || null; }
const checkKey = (sid, i) => sid + "." + i;

async function go(i, auto) {
  cancel();
  const sid = PL.sid, sts = P.states[sid];
  if (!Array.isArray(sts) || !sts.length) return;
  PL.i = clamp(i, 0, sts.length - 1);
  PL.wasAuto = auto;
  syncHash();
  const prev = PL.i ? sts[PL.i - 1] : P.init;
  renderMap(PL.M, prev, { prev });
  PL.M.layers.overlay.replaceChildren();
  PL.M.layers.labels.replaceChildren();
  renderStats(prev);
  showCaption(PL.i);
  if (pendingCheck()) return;
  setPlaying(auto);
  const my = PL.tk;
  try {
    for (;;) {
      await animateStep(PL.i);
      if (!PL.playing || my !== PL.tk) break;
      await hold(HOLD_MS);
      if (PL.i >= sts.length - 1) break;
      PL.i++;
      syncHash();
      showCaption(PL.i);

}

function statColumns(sid) {

  const names = [];

  for (const n of names) cols.push({ k: "counter", name: n });

}

function selectTab(id, step, auto) {
  const isCompare = id === "compare";
  const tabId = isCompare ? "compare" : (issueOf(id) && !tabScenarios().includes(id) ? issueOf(id).id : id);
  document.querySelectorAll("[role=tab]").forEach(b => {
    const on = b.dataset.tab === tabId;
    b.setAttribute("aria-selected", String(on));
    b.tabIndex = on ? 0 : -1;
  });
  PL.compare = isCompare;
  $("flow-main").hidden = isCompare;
  $("controls").hidden = isCompare;
  $("compare-panel").hidden = !isCompare;
  if (isCompare) { cancel(); $("fixbar").hidden = true; buildCompare(); syncHash(); return; }
  stopCompare();
  setScenario(id);
  go(step || 0, auto === undefined ? !reduced() : auto);
}

function setScenario(sid) {
  PL.sid = sid;
  PL.cols = statColumns(sid);
  const sts = P.states[sid], ol = $("steps");
  ol.replaceChildren();
  renderFixbar(sid);
  const ob = originBanner(P.scen[sid]);
  $("origin").hidden = !ob;
  $("origin").replaceChildren(...(ob ? [ob] : []));
  const broken = !Array.isArray(sts);
  $("svgbox").hidden = broken;
  $("stats").hidden = broken;
  if (broken) {
    if ($("codepane")) $("codepane").hidden = true;
    markOutline(sid, -1);
    $("caption").replaceChildren(errorBox(ui("scenarioError"), sts && sts.error));
    return;
  }
  sts.forEach((st, i) => {
    const step = P.entries[sid][i].step, marks = [];
    if (st.hazards.length) marks.push(h("span", { class: "mk hz", title: "stale-writeback" }, "!"));
    if (st.failures.length) marks.push(h("span", { class: "mk fl" }, "×"));
    if ((st.skipped || []).length) marks.push(h("span", { class: "mk sk" }, "✓"));
    if (checkFor(sid, i)) marks.push(h("span", { class: "mk ck", title: ui("predict") }, "?"));
    ol.append(h("li", null, h("button", { type: "button", class: "step-btn" + (stepTag(step) === "inferred" ? " inferred" : "") + (st.inherited ? " inh" : ""), onclick: () => go(i, false) },
      h("span", { class: "n" }, pad2(i + 1)), h("span", { class: "t" }, tx(step.t)), marks)));
  });
}

function renderFixbar(sid) {
  const bar = $("fixbar"), s = P.scen[sid];
  const issue = s.kind === "fix" ? issueOf(sid) : s;
  const fixes = issue && issue.fixed_by ? issue.fixed_by.filter(f => P.scen[f]) : [];
  if (!issue || !fixes.length) { bar.hidden = true; bar.replaceChildren(); return; }
  const grp = h("div", { class: "seg", role: "group", "aria-label": ui("fixGroup") });
  const keep = () => PL.i;
  grp.append(h("button", { type: "button", "aria-pressed": String(sid === issue.id), onclick: () => { const i = keep(); setScenario(issue.id); go(i, false); } }, ui("before")));
  for (const f of fixes) {
    grp.append(h("button", { type: "button", "aria-pressed": String(sid === f), onclick: () => { const i = keep(); setScenario(f); go(i, false); } }, ui("after", { title: tx(P.scen[f].title) })));
  }
  bar.replaceChildren(grp);
  bar.hidden = false;
}

/* ============ compare: scenarios on one clock ============ */

const CMP = { t: 0, run: false, stop: null, last: 0, model: null };

function compareModel() {
  const ids = P.doc.compare.filter(id => Array.isArray(P.states[id]));
  const byTime = ids.some(id => P.states[id].some(s => s.clock_ms > 0));
  const lanes = ids.map(id => {
    const sts = P.states[id], segs = sts.map((st, k) => {
      const step = P.entries[id][k].step, t0 = byTime ? (k ? sts[k - 1].clock_ms : 0) : k, t1 = byTime ? st.clock_ms : k + 1;
      return { k, t0, t1, title: tx(step.t), est: stepTag(step) === "inferred" || waitTags(step).includes("estimated"), tag: waitTags(step)[0] || (byTime ? "" : "step"), st };
    });
    return { id, title: tx(P.scen[id].title), kind: P.scen[id].kind, segs, end: segs.length ? segs[segs.length - 1].t1 : 0 };
  });
  const tmax = Math.max(1, ...lanes.map(l => l.end));
  const counters = [];
  for (const l of lanes) for (const s of l.segs) for (const n of Object.keys(s.st.counters)) if (!counters.includes(n)) counters.push(n);
  return { lanes, tmax, byTime, counters };
}
function waitTags(step) {
  return step.do.filter(a => a[0] === "wait").map(a => { const m = ONE_PLACEHOLDER.exec(a[1]); const n = m && get(P.numbers, m[1]); return n ? n.tag : ""; });
}
const fmtT = t => (t <= 0 ? "0" : CMP.model.byTime ? fmtClock(t) : ui("stepUnit", { n: Math.round(t) }));

// Clock ticks land on round times (5 s, 1 min, 5 min…); a step axis on round counts.
const TIME_TICKS_MS = [100, 250, 500, 1e3, 2e3, 5e3, 1e4, 15e3, 3e4, 6e4, 12e4, 3e5, 6e5, 9e5, 18e5, 36e5, 72e5, 216e5, 432e5];
function niceStep(tmax, target, byTime) {
  const want = tmax / target;
  if (byTime) return TIME_TICKS_MS.find(t => t >= want) || TIME_TICKS_MS[TIME_TICKS_MS.length - 1];
  return Math.max(1, Math.ceil(want));
}

function buildCompare() {
  const box = $("compare-panel");
  CMP.model = compareModel();
  const md = CMP.model, narrow = innerWidth < NARROW_PX;
  const W = narrow ? 360 : 1100, X0 = narrow ? 12 : 340, X1 = narrow ? 300 : 960, ROW = narrow ? 40 : 26;
  const sc = (X1 - X0) / md.tmax;
  const svg = sv("svg", { viewBox: `0 0 ${W} 100`, class: "race", role: "img", "aria-label": ui("compareTitle") });
  let y = 16;
  const bars = [];
  const grid = sv("g", null, svg);
  for (const lane of md.lanes) {
    sv("text", { class: "rgrp", x: 12, y: y + 14 }, svg, truncate(lane.title, narrow ? 46 : 60));
    y += 24;
    const rows = md.byTime ? lane.segs.filter(s => s.t1 > s.t0) : lane.segs;
    for (const s of rows) {
      if (narrow) { sv("text", { class: "rlab", x: X0, y: y + 11 }, svg, truncate(s.title, 52)); y += 15; }
      else sv("text", { class: "rlab", x: 12, y: y + 13 }, svg, truncate(s.title, 46));
      sv("rect", { class: "rtrack", x: X0 + s.t0 * sc, y, width: Math.max(2, (s.t1 - s.t0) * sc), height: 16, rx: 3 }, svg);
      const bar = sv("rect", { class: `rbar l${md.lanes.indexOf(lane) % 4}` + (s.est ? " est" : "") + (s.st.hazards.length || s.st.failures.length ? " bad" : ""), x: X0 + s.t0 * sc, y, width: 0, height: 16, rx: 3 }, svg);
      sv("title", null, bar, `${s.title}: ${fmtT(s.t0)} → ${fmtT(s.t1)}`);
      if (s.tag && !narrow) sv("text", { class: "rtag t-" + s.tag, x: X0 + s.t1 * sc + 6, y: y + 12 }, svg, s.tag === "step" ? "" : ui("tag." + s.tag));
      bars.push({ bar, a: s.t0, b: s.t1 });
      y += ROW - (narrow ? 15 : 0) + (narrow ? 12 : 0);
    }
    const markX = X0 + lane.end * sc;
    sv("path", { class: "rmark", d: `M${markX} ${y} l5 7 l-5 7 l-5 -7 z` }, svg);
    const right = !narrow || markX < W / 2;
    sv("text", { class: "rmile", x: right && narrow ? markX + 9 : markX - 9, y: y + 11, "text-anchor": right && narrow ? "start" : "end" }, svg, ui("doneAt", { t: fmtT(lane.end) }));
    for (const s of lane.segs) {
      if (!(s.st.hazards.length || s.st.failures.length)) continue;
      const x = X0 + s.t1 * sc;
      sv("circle", { class: "rbad", cx: x, cy: y + 7, r: 5 }, svg);
    }
    y += 30;
  }
  const step = niceStep(md.tmax, narrow ? 3 : 6, md.byTime);
  for (let t = 0; t <= md.tmax + 1e-9; t += step) {
    const x = X0 + t * sc;
    sv("line", { class: "rgrid", x1: x, y1: 8, x2: x, y2: y - 10 }, grid);
    sv("text", { class: "rtick", x, y: y + 4, "text-anchor": "middle" }, svg, fmtT(t));
  }
  const head = sv("line", { class: "rhead", x1: X0, y1: 8, x2: X0, y2: y - 10 }, svg);
  svg.setAttribute("viewBox", `0 0 ${W} ${y + 14}`);
  CMP.bars = bars; CMP.head = head; CMP.X0 = X0; CMP.sc = sc;
  const cards = h("div", { class: "rcards" }, md.lanes.map((l, i) => h("div", { class: "rcard l" + (i % 4) },
    h("h3", null, l.title),
    h("div", { class: "rvals" },
      md.counters.map(n => h("div", null, h("span", null, n.replace(/_/g, " ")), h("b", { "data-c": l.id + "|" + n }, "0"))),
      h("div", null, h("span", null, ui("hazards")), h("b", { "data-h": l.id }, "0")),
      h("div", null, h("span", null, ui("failures")), h("b", { "data-f": l.id }, "0"))))));
  const table = h("div", { class: "tbl" }, h("table", null,
    h("thead", null, h("tr", null, h("th", null, ""), md.lanes.map(l => h("th", null, l.title)))),
    h("tbody", null,
      h("tr", null, h("td", null, ui("totalTime")), md.lanes.map(l => h("td", { class: "n" }, fmtT(l.end)))),
      md.counters.map(n => h("tr", null, h("td", null, n.replace(/_/g, " ")), md.lanes.map(l => {
        const last = l.segs[l.segs.length - 1];
        return h("td", { class: "n" }, fmtInt(last ? get(last.st.counters, n) || 0 : 0));
      }))),
      h("tr", null, h("td", null, ui("hazards")), md.lanes.map(l => h("td", { class: "n" }, fmtInt(l.segs.reduce((a, s) => a + s.st.hazards.length, 0))))),
      h("tr", null, h("td", null, ui("failures")), md.lanes.map(l => h("td", { class: "n" }, fmtInt(l.segs.reduce((a, s) => a + s.st.failures.length, 0))))))));
  box.replaceChildren(
    h("div", { class: "race-head" },
      h("div", null, h("h2", null, ui("compareTitle")), h("p", { class: "muted" }, ui("compareLede"), md.byTime ? "" : " " + ui("timeAxisSteps"))),
      h("div", { class: "controls" },
        h("button", { type: "button", class: "btn primary", id: "r-play", onclick: () => (CMP.run ? stopCompare() : playCompare()) }, ui("play")),
        h("button", { type: "button", class: "btn", onclick: () => { stopCompare(); CMP.t = 0; renderCompare(); playCompare(); } }, ui("replay")))),
    h("div", { class: "clock", id: "r-clock", "aria-live": "off" }),
    h("figure", { class: "svgbox" }, svg), cards, table);
  stopCompare();
  CMP.t = reduced() ? md.tmax : 0;
  renderCompare();
  if (!reduced()) playCompare();
}

function counterAt(lane, name, t) {
  let v = 0;
  for (const s of lane.segs) {
    const before = s.k ? get(lane.segs[s.k - 1].st.counters, name) || 0 : 0, after = get(s.st.counters, name) || 0;
    if (t >= s.t1) { v = after; continue; }
    if (t > s.t0 && s.t1 > s.t0) v = before + (after - before) * (t - s.t0) / (s.t1 - s.t0);
    break;
  }
  return v;
}
function renderCompare() {
  const md = CMP.model, t = CMP.t;
  for (const r of CMP.bars) r.bar.setAttribute("width", Math.max(0, Math.min(t, r.b) - r.a) * CMP.sc);
  const x = CMP.X0 + t * CMP.sc;
  CMP.head.setAttribute("x1", x); CMP.head.setAttribute("x2", x);
  $("r-clock").textContent = fmtT(t);
  for (const l of md.lanes) {
    for (const n of md.counters) { const b = document.querySelector(`[data-c="${l.id}|${n}"]`); if (b) b.textContent = fmtInt(counterAt(l, n, t)); }
    const done = l.segs.filter(s => s.t1 <= t + 1e-9);
    const hb = document.querySelector(`[data-h="${l.id}"]`), fb = document.querySelector(`[data-f="${l.id}"]`);
    if (hb) hb.textContent = fmtInt(done.reduce((a, s) => a + s.st.hazards.length, 0));
    if (fb) fb.textContent = fmtInt(done.reduce((a, s) => a + s.st.failures.length, 0));
  }
}
function tickCompare(now) {
  if (!CMP.run) return;
  const dt = now - CMP.last; CMP.last = now;
  CMP.t = Math.min(CMP.model.tmax, CMP.t + (dt / COMPARE_RUN_MS) * CMP.model.tmax * speed());
  renderCompare();
  if (CMP.t >= CMP.model.tmax) { stopCompare(); return; }
  CMP.stop = nextFrame(tickCompare);
}
function playCompare() {
  if (CMP.t >= CMP.model.tmax) CMP.t = 0;
  CMP.run = true; CMP.last = performance.now();
  const b = $("r-play"); if (b) b.textContent = ui("pause");
  CMP.stop = nextFrame(tickCompare);
}
function stopCompare() {
  CMP.run = false; if (CMP.stop) CMP.stop();
  const b = $("r-play"); if (b) b.textContent = ui("play");
}

/* ============ theme, language, boot ============ */

function readPref(k) { try { return localStorage.getItem(STORE_KEYS[k]); } catch (e) { return null; } } // fail-open: storage may be blocked
function writePref(k, v) { try { localStorage.setItem(STORE_KEYS[k], v); } catch (e) { /* fail-open: storage may be blocked */ } }
function applyTheme() {
  const root = document.documentElement;
  if (P.theme === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", P.theme);
  const b = $("theme-btn"); if (b) b.textContent = ui("theme", { mode: ui("theme" + cap(P.theme)) });
  redrawDiagram();
}
function cycleTheme() {
  const order = ["auto", "light", "dark"];
  P.theme = order[(order.indexOf(P.theme) + 1) % order.length];
  writePref("theme", P.theme);
  applyTheme();
}
function setLang(l) {
  if (l === P.lang) return;
  P.lang = l;
  writePref("lang", l);
  rerender();
}
function rerender() {
  const app = $("flow-app"), keep = { sid: PL.sid, i: PL.i, compare: PL.compare };
  cancel(); stopCompare(); hideTip();
  document.documentElement.lang = P.lang;
  P.need = measureNeeds();
  P.wideMap = layoutWide(P.need).W > WIDE_MAP_W;
  document.removeEventListener("keydown", onKey);
  if (P.tier === "heavy") {
    renderHeavy(app);
    if (keep.compare) selectTab("compare"); else if (keep.sid) selectTab(keep.sid, keep.i, false);
  } else renderLight(app);
}

function makeContext(data) {
  const doc = data.scenario;
  if (!doc || !Array.isArray(doc.scenarios) || !Array.isArray(doc.nodes) || !doc.nodes.length) throw new Error(ui("noScenario"));
  P = { doc, tier: data.tier === "heavy" ? "heavy" : "light", numbers: doc.numbers || {}, lang: "en", theme: "auto",
        nodeById: {}, scen: scenarioIndex(doc), order: doc.scenarios.map(s => s.id), states: {}, entries: {}, actors: {}, pendingCards: [] };
  for (const n of doc.nodes) put(P.nodeById, n.id, n);
  P.hasJa = P.tier === "heavy" && hasJa(doc);
  const snippets = data.snippets;
  P.snippets = snippets && typeof snippets === "object" && !Array.isArray(snippets) ? snippets : {};
  P.reference = Array.isArray(data.reference) ? data.reference.filter(f => f && typeof f.path === "string" && Array.isArray(f.symbols)) : [];
  P.terms = Array.isArray(doc.terms) ? doc.terms.filter(t => t && typeof t.term === "string" && t.term) : [];
  P.outline = Array.isArray(doc.outline) ? doc.outline.filter(o => o && Array.isArray(o.lines)) : [];
  P.diagrams = Array.isArray(doc.diagrams) ? doc.diagrams.filter(d => d && typeof d.source === "string" && d.source.trim()) : [];
  P.dgCur = 0;
  P.folds = {};
  const lang = readPref("lang");
  if (P.hasJa && lang === "ja") P.lang = "ja";
  P.theme = ["light", "dark"].includes(readPref("theme")) ? readPref("theme") : "auto";
  P.init = Object.assign(initialState(doc), { step: -1, active: [], messages: [], hit: null, failures: [], notes: [], hazards: [], skipped: [] });
  for (const sid of P.order) {
    try {
      P.entries[sid] = effectiveSteps(sid, P.scen);
      P.states[sid] = reduceScenario(doc, sid);
      P.actors[sid] = actorsFor(P.entries[sid]);
    } catch (e) {
      P.states[sid] = { error: e.message };
    }
  }
  P.hasCode = P.outline.length > 0 || doc.scenarios.some(s => (s.steps || []).some(st => Array.isArray(st.code) && st.code.length))
    || P.order.some(sid => (P.entries[sid] || []).some(e => stepSnippets(e.step, P.snippets).length));
  const mq = matchMedia("(prefers-reduced-motion: reduce)");
  P.reducedMotion = mq.matches;
  mq.addEventListener("change", e => { P.reducedMotion = e.matches; });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (P.theme === "auto") redrawDiagram(); });
  P.need = measureNeeds();
  P.wideMap = layoutWide(P.need).W > WIDE_MAP_W;
  return P;
}

function boot() {
  const root = document.documentElement, app = $("flow-app");
  try {
    makeContext(JSON.parse($("flow-data").textContent));
    root.lang = P.lang;
    applyTheme();
    (P.tier === "heavy" ? renderHeavy : renderLight)(app);
    wireTerms();
    wireSections();
    wirePopovers();
    app.removeAttribute("aria-busy");
    const broken = P.order.filter(id => !Array.isArray(P.states[id]));
    root.setAttribute("data-flow-steps", P.order.map(id => id + ":" + (Array.isArray(P.states[id]) ? P.states[id].length : "error")).join(","));
    if (broken.length) root.setAttribute("data-flow-error", broken.map(id => id + ": " + P.states[id].error).join("; "));
    else root.setAttribute("data-flow-ok", "true");
    let narrow = innerWidth < NARROW_PX;
    addEventListener("resize", () => { const now = innerWidth < NARROW_PX; if (now !== narrow) { narrow = now; rerender(); } });
  } catch (e) {
    root.setAttribute("data-flow-error", String((e && e.message) || e));
    app.removeAttribute("aria-busy");
    app.replaceChildren(errorBox(P ? ui("fatal") : UI.en.fatal, String((e && e.message) || e)));
  }
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
